<!DOCTYPE html>

<html lang="ja">

<head>

  <meta charset="UTF-8">

  <title>イベントバブリングの違い</title>

  <style>

    #parent {

      width: 300px;

      height: 200px;

      background-color: #cce5ff;

      padding: 20px;

    }



    #child {

      width: 150px;

      height: 100px;

      background-color: #99ccff;

    }

  </style>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

</head>

<body>



<div id="parent">

  親要素

  <div id="child">子要素</div>

</div>



<script>

  $('#parent').on('mouseover', function() {

    console.log('mouseover: 親にマウスが入った');

  });

</script>

</body>

</html>
